services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo

  client:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo-data: